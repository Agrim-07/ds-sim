# Production stack: the app behind Caddy, which provides automatic HTTPS.
# Requires a .env file next to this one (see .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      DS_SIM_MASTER_KEY: ${DS_SIM_MASTER_KEY:?Set DS_SIM_MASTER_KEY in .env}
    volumes:
      - app-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
